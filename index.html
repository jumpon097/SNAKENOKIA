<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nokia 3310 Ultimate Snake (5 Skins & 4 Modes)</title>
    <style>
        /* ระบบ CSS Variables สำหรับเปลี่ยนสกิน */
        :root {
            --bg-page: #ffe4e8;
            --body-bg: linear-gradient(135deg, #ffb6c1, #ff8da1);
            --body-shadow: rgba(255,105,148,0.4);
            --face-bg: linear-gradient(160deg, #ffffff, #fff0f5);
            --speaker-color: #ff8da1;
            --logo-color: #ff8da1;
            --screen-border: #4a3b42;
            --screen-bg: #8cb878;
            --screen-dot: #7ba369;
            --btn-bg: linear-gradient(180deg, #ffffff, #ffe4e8);
            --btn-border: #ffb6c1;
            --btn-shadow: #ff9eaa;
            --btn-text: #d17b88;
            --navi-accent: #ff69b4;
            --overlay-bg: rgba(140, 184, 120, 0.95);
            --overlay-text: #172111;
        }

        body {
            background-color: var(--bg-page); 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            touch-action: manipulation; 
            transition: background-color 0.3s;
        }

        .nokia-body {
            background: var(--body-bg); 
            border-radius: 60px 60px 70px 70px / 50px 50px 80px 80px;
            padding: 20px 15px 35px 15px;
            box-shadow: 
                inset 5px 5px 20px rgba(255,255,255,0.3), 
                inset -8px -8px 25px rgba(0,0,0,0.2),
                10px 20px 50px var(--body-shadow);
            width: 95vw; 
            max-width: 400px; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .faceplate {
            background: var(--face-bg); 
            width: 100%;
            border-radius: 45px 45px 55px 55px / 40px 40px 60px 60px;
            padding: 20px 20px 30px 20px;
            box-sizing: border-box;
            box-shadow: 
                inset 0 4px 8px rgba(255,255,255,0.6),
                inset 0 -4px 10px rgba(0,0,0,0.1),
                0 8px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .speaker {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 20px;
        }
        .speaker div {
            width: 5px; height: 20px;
            background-color: var(--speaker-color); 
            border-radius: 3px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .logo-text {
            color: var(--logo-color); 
            font-weight: 900;
            letter-spacing: 3px;
            font-size: 15px;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 0 1px 1px rgba(255,255,255,0.5);
        }

        .screen-border {
            background-color: var(--screen-border); 
            padding: 15px 15px 25px 15px;
            border-radius: 12px 12px 40px 40px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.9);
            position: relative;
        }

        .screen {
            background-color: var(--screen-bg); 
            border-radius: 3px;
            padding: 6px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            background-image: radial-gradient(var(--screen-dot) 1px, transparent 1px);
            background-size: 4px 4px;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated; 
            background-color: transparent;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            color: var(--overlay-text);
            font-weight: bold;
            font-size: 11px;
            font-family: 'Courier New', Courier, monospace;
            margin-bottom: 4px;
            z-index: 5;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--overlay-bg);
            color: var(--overlay-text);
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            font-weight: bold;
            text-align: left;
            flex-direction: column;
            z-index: 10;
        }
        
        .menu-item {
            width: 100%;
            padding: 3px 15px;
            box-sizing: border-box;
            font-size: 12px;
            text-align: left;
        }
        .menu-item.active {
            background-color: var(--overlay-text);
            color: var(--screen-bg);
        }

        .nav-cluster {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            margin-top: 25px;
            padding: 0 5px;
            box-sizing: border-box;
            position: relative;
        }

        .nav-btn {
            background: var(--btn-bg); 
            border: 1px solid var(--btn-border);
            box-shadow: 0 5px var(--btn-shadow), inset 0 2px 4px rgba(255,255,255,0.4);
            color: var(--btn-text); 
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s;
        }
        .nav-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 var(--btn-shadow), inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .btn-c {
            width: 55px; height: 50px;
            border-radius: 25px 8px 8px 25px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 3px;
        }

        .btn-navi {
            width: 120px; height: 55px;
            border-radius: 8px 8px 35px 35px;
            margin-top: -15px; 
            position: relative;
        }
        .btn-navi::after {
            content: '';
            position: absolute;
            top: 35%; left: 50%;
            transform: translate(-50%, -50%);
            width: 35px; height: 4px;
            background-color: var(--navi-accent); 
            border-radius: 2px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
        }

        /* ขยายปุ่มลูกศรขึ้น-ลง ให้ใหญ่ขึ้นเป็นวงรีเต็มพื้นที่ด้านขวา */
        .rocker-container {
            display: flex;
            flex-direction: column;
            transform: rotate(25deg); /* เอียงขวาให้ขนานกับขอบเครื่องมากขึ้น */
            margin-top: -15px; /* ขยับขึ้นให้สมดุล */
            margin-right: -12px; /* ชิดขอบขวาให้เต็มพื้นที่ */
        }

        .btn-up {
            width: 100px; height: 65px; /* ขยายขนาดใหญ่สุดๆ */
            border-radius: 50px 50px 10px 10px; /* โค้งบนเป็นครึ่งวงรี */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 28px; /* ขยายไอคอน */
            padding-bottom: 4px;
        }
        .btn-down {
            width: 100px; height: 65px; /* ขยายขนาดใหญ่สุดๆ */
            border-radius: 10px 10px 50px 50px; /* โค้งล่างเป็นครึ่งวงรี */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 28px; /* ขยายไอคอน */
            padding-top: 4px;
            margin-top: 6px; /* เว้นช่องตรงกลางนิดหน่อยให้ดูเป็น 2 ปุ่ม */
        }
        .turn-icon { font-size: 14px; color: var(--btn-text); margin-top: -4px; font-weight: bold; }

        .top-btn {
            position: absolute;
            top: 15px; 
            background: #fff;
            border: 2px solid #222;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 2px 2px 0 #222;
            color: #222;
        }
        .top-btn:active { transform: translate(2px, 2px); box-shadow: none; }
        
        .skin-toggle { left: 15px; }
        .sound-toggle { right: 15px; }
    </style>
</head>
<body>
    
    <button class="top-btn skin-toggle" id="skinBtn" onclick="nextSkin()">🎨 PINK</button>
    <button class="top-btn sound-toggle" id="soundBtn" onclick="toggleSound()">🔊 ON</button>

    <div class="nokia-body">
        <div class="faceplate">
            <div class="speaker">
                <div></div><div></div><div></div><div></div>
            </div>
            <div class="logo-text" id="brandLogo">NOKIA ♥</div>
            
            <div class="screen-border">
                <div class="screen">
                    <div class="top-bar" id="topBar">
                        <span id="leftInfo">SNAKE</span>
                        <span id="rightInfo">0</span>
                    </div>
                    <canvas id="gameCanvas" width="84" height="48"></canvas>
                    
                    <div id="overlay" class="overlay">
                        <div style="text-align:center; font-size:16px; margin-bottom:8px;">SELECT MODE</div>
                        <div id="menu-0" class="menu-item active">1. FREEPLAY</div>
                        <div id="menu-1" class="menu-item">2. TIME ATTACK</div>
                        <div id="menu-2" class="menu-item">3. CAMPAIGN</div>
                        <div id="menu-3" class="menu-item">4. 2 PLAYER</div>
                        <div style="font-size:8px; text-align:center; margin-top:10px;">▲▼:Select | Navi:OK</div>
                    </div>
                </div>
            </div>

            <!-- ชุดปุ่มบังคับใต้จอ -->
            <div class="nav-cluster">
                <button class="nav-btn btn-c" onclick="handleBtn('C')">C</button>
                <button class="nav-btn btn-navi" onclick="handleBtn('NAVI')"></button>
                <div class="rocker-container">
                    <button class="nav-btn btn-up" onclick="handleBtn('UP')">
                        ▲<span class="turn-icon">↺</span>
                    </button>
                    <button class="nav-btn btn-down" onclick="handleBtn('DOWN')">
                        <span class="turn-icon" style="margin-top: 0; margin-bottom: -2px;">↻</span>▼
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- ระบบสกิน (Themes) ---
        const skins = [
            {
                name: "PINK", logo: "NOKIA ♥",
                css: {
                    "--bg-page": "#ffe4e8",
                    "--body-bg": "linear-gradient(135deg, #ffb6c1, #ff8da1)",
                    "--body-shadow": "rgba(255,105,148,0.4)",
                    "--face-bg": "linear-gradient(160deg, #ffffff, #fff0f5)",
                    "--speaker-color": "#ff8da1",
                    "--logo-color": "#ff8da1",
                    "--screen-border": "#4a3b42",
                    "--screen-bg": "#8cb878",
                    "--screen-dot": "#7ba369",
                    "--btn-bg": "linear-gradient(180deg, #ffffff, #ffe4e8)",
                    "--btn-border": "#ffb6c1",
                    "--btn-shadow": "#ff9eaa",
                    "--btn-text": "#d17b88",
                    "--navi-accent": "#ff69b4",
                    "--overlay-bg": "rgba(140, 184, 120, 0.95)",
                    "--overlay-text": "#172111"
                },
                pixel: "#172111"
            },
            {
                name: "CLASSIC", logo: "NOKIA",
                css: {
                    "--bg-page": "#e2e8f0",
                    "--body-bg": "linear-gradient(135deg, #3a414c, #242933)",
                    "--body-shadow": "rgba(0,0,0,0.5)",
                    "--face-bg": "linear-gradient(160deg, #eaedf0, #b1b8c0)",
                    "--speaker-color": "#111",
                    "--logo-color": "#242933",
                    "--screen-border": "#212529",
                    "--screen-bg": "#8cb878",
                    "--screen-dot": "#7ba369",
                    "--btn-bg": "linear-gradient(180deg, #d8dce0, #aab1b8)",
                    "--btn-border": "#999",
                    "--btn-shadow": "#767d84",
                    "--btn-text": "#222",
                    "--navi-accent": "#0088cc",
                    "--overlay-bg": "rgba(140, 184, 120, 0.95)",
                    "--overlay-text": "#172111"
                },
                pixel: "#172111"
            },
            {
                name: "RETRO", logo: "GAME ♥",
                css: {
                    "--bg-page": "#e9e9e9",
                    "--body-bg": "linear-gradient(135deg, #d3d3d3, #a9a9a9)",
                    "--body-shadow": "rgba(0,0,0,0.3)",
                    "--face-bg": "linear-gradient(160deg, #f0f0f0, #cccccc)",
                    "--speaker-color": "#444",
                    "--logo-color": "#8b0000",
                    "--screen-border": "#555",
                    "--screen-bg": "#9bbc0f",
                    "--screen-dot": "#8bac0f",
                    "--btn-bg": "linear-gradient(180deg, #990000, #660000)",
                    "--btn-border": "#440000",
                    "--btn-shadow": "#330000",
                    "--btn-text": "#ffffff",
                    "--navi-accent": "#333",
                    "--overlay-bg": "rgba(155, 188, 15, 0.95)",
                    "--overlay-text": "#0f380f"
                },
                pixel: "#0f380f"
            },
            {
                name: "CYBER", logo: "NEON",
                css: {
                    "--bg-page": "#0f0f13",
                    "--body-bg": "linear-gradient(135deg, #1f1f2e, #14141d)",
                    "--body-shadow": "rgba(0,0,0,0.8)",
                    "--face-bg": "linear-gradient(160deg, #2a2a3d, #1f1f2e)",
                    "--speaker-color": "#0ff",
                    "--logo-color": "#f0f",
                    "--screen-border": "#000",
                    "--screen-bg": "#111",
                    "--screen-dot": "#1a1a1a",
                    "--btn-bg": "linear-gradient(180deg, #333, #222)",
                    "--btn-border": "#444",
                    "--btn-shadow": "#111",
                    "--btn-text": "#0ff",
                    "--navi-accent": "#f0f",
                    "--overlay-bg": "rgba(0, 0, 0, 0.9)",
                    "--overlay-text": "#0ff"
                },
                pixel: "#0ff"
            },
            {
                name: "OCEAN", logo: "NOKIA 🌊",
                css: {
                    "--bg-page": "#e0f2fe",
                    "--body-bg": "linear-gradient(135deg, #38bdf8, #0284c7)",
                    "--body-shadow": "rgba(2,132,199,0.5)",
                    "--face-bg": "linear-gradient(160deg, #f0f9ff, #bae6fd)",
                    "--speaker-color": "#0369a1",
                    "--logo-color": "#f0f9ff",
                    "--screen-border": "#082f49",
                    "--screen-bg": "#bae6fd",
                    "--screen-dot": "#7dd3fc",
                    "--btn-bg": "linear-gradient(180deg, #f0f9ff, #e0f2fe)",
                    "--btn-border": "#7dd3fc",
                    "--btn-shadow": "#0284c7",
                    "--btn-text": "#0369a1",
                    "--navi-accent": "#fbbf24",
                    "--overlay-bg": "rgba(186, 230, 253, 0.95)",
                    "--overlay-text": "#082f49"
                },
                pixel: "#082f49"
            }
        ];

        let currentSkin = 0;
        let COLOR_PIXEL = skins[0].pixel;

        function nextSkin() {
            playSound('key');
            currentSkin = (currentSkin + 1) % skins.length;
            const skin = skins[currentSkin];
            
            document.getElementById('skinBtn').innerText = `🎨 ${skin.name}`;
            document.getElementById('brandLogo').innerText = skin.logo;
            
            // อัปเดต CSS Variables
            for (const [key, value] of Object.entries(skin.css)) {
                document.documentElement.style.setProperty(key, value);
            }
            
            // อัปเดตพิกเซลใน Canvas และวาดใหม่ทันที
            COLOR_PIXEL = skin.pixel;
            if (gameState === 'MENU') drawMenu();
            else draw();
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const topBar = document.getElementById('topBar');
        const leftInfo = document.getElementById('leftInfo');
        const rightInfo = document.getElementById('rightInfo');
        
        // --- ระบบเสียง 8-bit ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // ปลดล็อคเสียงบนมือถือ (แก้ปัญหา iOS/Android ไม่เล่นเสียงจนกว่าจะมีการตอบสนอง)
        function unlockAudio() {
            initAudio();
            if(audioCtx) {
                // สร้างเสียงเงียบๆ เพื่อปลดล็อค context ทันทีที่แตะจอ
                const buffer = audioCtx.createBuffer(1, 1, 22050);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.start(0);
            }
            // ปลดล็อคแล้วให้เอา listener ออก
            document.removeEventListener('touchstart', unlockAudio);
            document.removeEventListener('click', unlockAudio);
        }
        document.addEventListener('touchstart', unlockAudio, { once: true });
        document.addEventListener('click', unlockAudio, { once: true });

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').innerText = soundEnabled ? "🔊 ON" : "🔇 OFF";
            if (soundEnabled) playSound('key');
        }

        // ปรับ Default Volume เป็น 0.5 เผื่อไว้
        function playTone(freq, type, duration, vol=0.5) {
            if (!audioCtx || !soundEnabled) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = type; 
            oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        function playSound(action) {
            initAudio(); 
            if (!soundEnabled) return;
            // ปรับเพิ่มความดัง (Volume Boost) ตรงตัวเลขตัวที่ 4 ในฟังก์ชัน playTone ให้ดังขึ้น
            switch(action) {
                case 'key': playTone(1500, 'square', 0.05, 0.2); break; // เดิม 0.03
                case 'eat': 
                    playTone(1200, 'square', 0.1, 0.4); // เดิม 0.05
                    setTimeout(() => playTone(1800, 'square', 0.15, 0.4), 80);
                    break;
                case 'die': 
                    playTone(300, 'sawtooth', 0.2, 0.6); // เดิม 0.1
                    setTimeout(() => playTone(250, 'sawtooth', 0.2, 0.6), 150);
                    setTimeout(() => playTone(200, 'sawtooth', 0.4, 0.6), 300);
                    break;
                case 'start': 
                    playTone(800, 'square', 0.1, 0.3); // เดิม 0.05
                    setTimeout(() => playTone(1000, 'square', 0.1, 0.3), 100);
                    setTimeout(() => playTone(1200, 'square', 0.2, 0.3), 200);
                    break;
                case 'levelup': 
                    playTone(900, 'square', 0.1, 0.3); // เดิม 0.05
                    setTimeout(() => playTone(1100, 'square', 0.1, 0.3), 100);
                    setTimeout(() => playTone(1300, 'square', 0.1, 0.3), 200);
                    setTimeout(() => playTone(1500, 'square', 0.3, 0.3), 300);
                    break;
            }
        }

        // --- ระบบ Game State & Modes ---
        const MODES = ['FREEPLAY', 'TIME_ATTACK', 'CAMPAIGN', 'TWO_PLAYER'];
        let menuIndex = 0;
        let gameState = 'MENU'; 
        let currentMode = '';

        const gridSize = 3; 
        const tileX = canvas.width / gridSize;  
        const tileY = canvas.height / gridSize; 

        let snake1 = [], dx1 = 0, dy1 = 0, changing1 = false;
        let snake2 = [], dx2 = 0, dy2 = 0, changing2 = false;
        let food = { x: 0, y: 0 };
        
        let score1 = 0, score2 = 0;
        let gameSpeed = 100; 
        let gameLoopId;
        
        let timeLeft = 0;
        let level = 1;
        let obstacles = [];
        let timeIntervalId;

        function drawMenu() {
            gameState = 'MENU';
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div style="text-align:center; font-size:14px; margin-bottom:8px;">SELECT MODE</div>
                <div id="menu-0" class="menu-item ${menuIndex === 0 ? 'active' : ''}">1. FREEPLAY</div>
                <div id="menu-1" class="menu-item ${menuIndex === 1 ? 'active' : ''}">2. TIME ATTACK</div>
                <div id="menu-2" class="menu-item ${menuIndex === 2 ? 'active' : ''}">3. CAMPAIGN</div>
                <div id="menu-3" class="menu-item ${menuIndex === 3 ? 'active' : ''}">4. 2 PLAYER</div>
                <div style="font-size:9px; text-align:center; margin-top:8px;">▲/▼:Scroll | Navi:OK</div>
            `;
            topBar.style.display = 'none';
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
        }

        function showGameOver(msg) {
            gameState = 'GAMEOVER';
            clearInterval(timeIntervalId);
            playSound('die');
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div style="text-align:center; font-size:16px; margin-bottom:10px;">GAME OVER</div>
                <div style="font-size:12px; text-align:center; margin-bottom:10px;">${msg}</div>
                <div style="font-size:9px; text-align:center;">Press C to Menu<br>Navi to Retry</div>
            `;
        }

        function showLevelUp() {
            gameState = 'LEVELUP';
            playSound('levelup');
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div style="text-align:center; font-size:16px; margin-bottom:10px;">LEVEL CLEARED!</div>
                <div style="font-size:12px; text-align:center; margin-bottom:10px;">Get Ready...</div>
            `;
            setTimeout(() => {
                level++;
                startGame('CAMPAIGN', true); 
            }, 2500);
        }

        function updateTopBar() {
            if (currentMode === 'TIME_ATTACK') {
                leftInfo.innerText = `TIME:${timeLeft}`;
                rightInfo.innerText = score1;
            } else if (currentMode === 'CAMPAIGN') {
                leftInfo.innerText = `LVL:${level}`;
                rightInfo.innerText = `${score1}/${level * 50}`;
            } else if (currentMode === 'TWO_PLAYER') {
                leftInfo.innerText = `P1:${score1}`;
                rightInfo.innerText = `P2:${score2}`;
            } else {
                leftInfo.innerText = 'SNAKE';
                rightInfo.innerText = score1;
            }
        }

        function initObstacles(lvl) {
            obstacles = [];
            if (lvl === 2) {
                for(let i=12; i<16; i++) for(let j=6; j<10; j++) obstacles.push({x:i, y:j});
            } else if (lvl === 3) {
                for(let i=4; i<24; i++) { obstacles.push({x:i, y:3}); obstacles.push({x:i, y:12}); }
            } else if (lvl >= 4) {
                for(let i=2; i<26; i++) { obstacles.push({x:i, y:1}); obstacles.push({x:i, y:14}); }
                for(let j=1; j<15; j++) { obstacles.push({x:2, y:j}); obstacles.push({x:25, y:j}); }
            }
        }

        function isCollisionWithObstacle(x, y) {
            return obstacles.some(obs => obs.x === x && obs.y === y);
        }

        function placeFood() {
            let valid = false;
            while (!valid) {
                valid = true;
                food.x = Math.floor(Math.random() * tileX);
                food.y = Math.floor(Math.random() * tileY);
                if (snake1.some(p => p.x === food.x && p.y === food.y)) valid = false;
                if (currentMode === 'TWO_PLAYER' && snake2.some(p => p.x === food.x && p.y === food.y)) valid = false;
                if (isCollisionWithObstacle(food.x, food.y)) valid = false;
            }
        }

        function startGame(mode, keepLevel = false) {
            playSound('start'); 
            currentMode = mode;
            gameState = 'PLAYING';
            overlay.style.display = 'none';
            topBar.style.display = 'flex';
            clearInterval(timeIntervalId);
            clearTimeout(gameLoopId);

            score1 = 0; score2 = 0;
            gameSpeed = 100;
            if (!keepLevel) level = 1;

            snake1 = [{ x: 10, y: 8 }, { x: 10, y: 9 }, { x: 10, y: 10 }];
            dx1 = 0; dy1 = -1;

            if (currentMode === 'TWO_PLAYER') {
                snake2 = [{ x: 18, y: 7 }, { x: 18, y: 6 }, { x: 18, y: 5 }];
                dx2 = 0; dy2 = 1;
            } else {
                snake2 = []; 
            }

            if (currentMode === 'CAMPAIGN') initObstacles(level);
            else obstacles = [];

            if (currentMode === 'TIME_ATTACK') {
                timeLeft = 60; 
                timeIntervalId = setInterval(() => {
                    if(gameState === 'PLAYING') {
                        timeLeft--;
                        updateTopBar();
                        if(timeLeft <= 0) showGameOver(`TIME'S UP!<br>SCORE: ${score1}`);
                    }
                }, 1000);
            }

            placeFood();
            updateTopBar();
            gameLoop();
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            let head1 = { x: snake1[0].x + dx1, y: snake1[0].y + dy1 };
            if (head1.x < 0) head1.x = tileX - 1; if (head1.x >= tileX) head1.x = 0;
            if (head1.y < 0) head1.y = tileY - 1; if (head1.y >= tileY) head1.y = 0;

            let p1Died = snake1.some(p => p.x === head1.x && p.y === head1.y) || 
                         isCollisionWithObstacle(head1.x, head1.y) ||
                         (currentMode === 'TWO_PLAYER' && snake2.some(p => p.x === head1.x && p.y === head1.y));
            
            let head2 = null;
            let p2Died = false;
            if (currentMode === 'TWO_PLAYER') {
                head2 = { x: snake2[0].x + dx2, y: snake2[0].y + dy2 };
                if (head2.x < 0) head2.x = tileX - 1; if (head2.x >= tileX) head2.x = 0;
                if (head2.y < 0) head2.y = tileY - 1; if (head2.y >= tileY) head2.y = 0;

                p2Died = snake2.some(p => p.x === head2.x && p.y === head2.y) ||
                         snake1.some(p => p.x === head2.x && p.y === head2.y);
                
                if (head1.x === head2.x && head1.y === head2.y) { p1Died = true; p2Died = true; }
            }

            if (currentMode === 'TWO_PLAYER') {
                if (p1Died && p2Died) return showGameOver("DRAW! (BOTH DIED)");
                if (p1Died) return showGameOver("P2 (Striped) WINS!");
                if (p2Died) return showGameOver("P1 (Solid) WINS!");
            } else {
                if (p1Died) return showGameOver(`SCORE: ${score1}`);
            }

            snake1.unshift(head1);
            if (head1.x === food.x && head1.y === food.y) {
                playSound('eat'); 
                score1 += 10;
                if (currentMode === 'TIME_ATTACK') timeLeft += 2; 
                if (gameSpeed > 40) gameSpeed -= 2; 
                placeFood();
                updateTopBar();

                if (currentMode === 'CAMPAIGN' && score1 >= level * 50) return showLevelUp();
            } else {
                snake1.pop();
            }

            if (currentMode === 'TWO_PLAYER') {
                snake2.unshift(head2);
                if (head2.x === food.x && head2.y === food.y) {
                    playSound('eat'); 
                    score2 += 10;
                    placeFood();
                    updateTopBar();
                } else {
                    snake2.pop();
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            ctx.fillStyle = COLOR_PIXEL;

            obstacles.forEach(obs => {
                ctx.fillRect(obs.x * gridSize, obs.y * gridSize, gridSize, gridSize);
            });

            ctx.fillRect(food.x * gridSize + 1, food.y * gridSize + 1, gridSize-1, gridSize-1);

            snake1.forEach((part) => {
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
            });

            if (currentMode === 'TWO_PLAYER') {
                snake2.forEach((part) => {
                    ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
                    ctx.clearRect(part.x * gridSize + 1, part.y * gridSize + 1, 1, 1); 
                });
            }
        }

        function gameLoop() {
            if (gameState === 'PLAYING') {
                changing1 = false; 
                changing2 = false;
                update();
                draw();
                gameLoopId = setTimeout(gameLoop, gameSpeed); 
            }
        }

        function turn(player, dir) {
            playSound('key');
            if (gameState !== 'PLAYING') return;

            if (player === 1) {
                if (changing1) return;
                if (dir === 'RIGHT') {
                    if (dy1 === -1) { dx1 = 1; dy1 = 0; } else if (dx1 === 1) { dx1 = 0; dy1 = 1; }
                    else if (dy1 === 1) { dx1 = -1; dy1 = 0; } else if (dx1 === -1) { dx1 = 0; dy1 = -1; }
                } else {
                    if (dy1 === -1) { dx1 = -1; dy1 = 0; } else if (dx1 === -1) { dx1 = 0; dy1 = 1; }
                    else if (dy1 === 1) { dx1 = 1; dy1 = 0; } else if (dx1 === 1) { dx1 = 0; dy1 = -1; }
                }
                changing1 = true;
            } else if (player === 2 && currentMode === 'TWO_PLAYER') {
                if (changing2) return;
                if (dir === 'RIGHT') {
                    if (dy2 === -1) { dx2 = 1; dy2 = 0; } else if (dx2 === 1) { dx2 = 0; dy2 = 1; }
                    else if (dy2 === 1) { dx2 = -1; dy2 = 0; } else if (dx2 === -1) { dx2 = 0; dy2 = -1; }
                } else {
                    if (dy2 === -1) { dx2 = -1; dy2 = 0; } else if (dx2 === -1) { dx2 = 0; dy2 = 1; }
                    else if (dy2 === 1) { dx2 = 1; dy2 = 0; } else if (dx2 === 1) { dx2 = 0; dy2 = -1; }
                }
                changing2 = true;
            }
        }

        function handleBtn(btn) {
            playSound('key');
            if (gameState === 'MENU') {
                if (btn === 'UP') { menuIndex = (menuIndex - 1 + MODES.length) % MODES.length; drawMenu(); }
                if (btn === 'DOWN') { menuIndex = (menuIndex + 1) % MODES.length; drawMenu(); }
                if (btn === 'NAVI') { startGame(MODES[menuIndex]); }
            } else if (gameState === 'GAMEOVER') {
                if (btn === 'C') { drawMenu(); }
                if (btn === 'NAVI') { startGame(currentMode); } 
            } else if (gameState === 'PLAYING') {
                if (currentMode === 'TWO_PLAYER') {
                    if (btn === 'C') turn(1, 'LEFT');
                    if (btn === 'NAVI') turn(1, 'RIGHT');
                    if (btn === 'UP') turn(2, 'LEFT');
                    if (btn === 'DOWN') turn(2, 'RIGHT');
                } else {
                    if (btn === 'UP') turn(1, 'LEFT');
                    if (btn === 'DOWN') turn(1, 'RIGHT');
                    if (btn === 'C') showGameOver("SURRENDERED");
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            if(e.repeat) return; 
            initAudio();
            const k = e.key;

            if (gameState === 'MENU') {
                if (k === 'ArrowUp' || k === 'w') handleBtn('UP');
                if (k === 'ArrowDown' || k === 's') handleBtn('DOWN');
                if (k === 'Enter' || k === ' ') handleBtn('NAVI');
            } else if (gameState === 'GAMEOVER') {
                if (k === 'c' || k === 'C') handleBtn('C');
                if (k === 'Enter' || k === ' ') handleBtn('NAVI');
            } else if (gameState === 'PLAYING') {
                if (currentMode === 'TWO_PLAYER') {
                    if (k === 'a' || k === 'A') turn(1, 'LEFT');
                    if (k === 'd' || k === 'D') turn(1, 'RIGHT');
                    if (k === 'ArrowLeft') turn(2, 'LEFT');
                    if (k === 'ArrowRight') turn(2, 'RIGHT');
                } else {
                    if (k === 'ArrowLeft' || k === 'a' || k === 'A' || k === '4') turn(1, 'LEFT');
                    if (k === 'ArrowRight' || k === 'd' || k === 'D' || k === '6') turn(1, 'RIGHT');
                    if (k === 'c' || k === 'C') handleBtn('C');
                }
            }
        });

        // เปิดเว็บมา โชว์หน้าเมนูก่อนเลย
        drawMenu();

    </script>
</body>
</html>
